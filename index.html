<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banco Monopoly</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🏦 Banco Monopoly</h1>
        
        <div id="user-selection" class="card">
            <h3>Selecciona tu usuario</h3>
            <select id="player-select">
                <option value="">Cargando jugadores...</option>
            </select>
            <!-- Sección para registrar nuevo jugador -->
            <div id="register-section" class="card">
                <h3>¿Nuevo jugador?</h3>
                <input type="text" id="new-name" placeholder="Tu nombre">
                <button onclick="crearJugador()" class="btn-register">Registrarse</button>
            </div>
            <button onclick="seleccionarJugador()">Entrar</button>
        </div>

        <div id="dashboard" class="card hidden">
            <h2 id="welcome-user">Hola</h2>
           <div class="balance-box">
                <p>Tu Saldo Actual:</p>
                <h3 id="user-balance">$0</h3>
            </div>

            <!-- NUEVO: Botón de COBRAR GO -->
            <button class="btn-go" onclick="cobrarGo()">🚀 Cobrar $200 por pasar por GO</button>

            <div class="transfer-section">
                <h3>Realizar Pago / Transferencia</h3>
...
                <label>Pagar a:</label>
                <select id="target-select">
                    </select>
                <label>Monto ($):</label>
                <input type="number" id="amount-input" placeholder="Ej. 500">
                <label>Concepto:</label>
                <input type="text" id="concept-input" placeholder="Ej. Racha de alquiler">
                <button class="btn-pay" onclick="realizarPago()">Enviar Dinero</button>
            </div>
            
            <button class="btn-refresh" onclick="cargarDatos()">Actualizar Datos</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
